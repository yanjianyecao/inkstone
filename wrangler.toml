name = "inkstone"
account_id = "7dd49b6326f49f0a13d2f672f00821fc"
main = "src/worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/index.html",
  "/api",
  "/api/*",
  "/s",
  "/s/*",
  "/authorize",
  "/authorize/*",
  "/oauth/*",
  "/mcp",
  "/mcp/*",
  "/.well-known/*",
]

[[d1_databases]]
binding = "DB"
database_name = "inkstone-db"
database_id = "fd696f76-a27d-498a-9350-2eb9cef3c13a"

[[r2_buckets]]
binding = "FILES"
bucket_name = "inkstone-files"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "739abaf8a9b84eaaa51518411f302bfa"

[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "SyncHub"

[[durable_objects.bindings]]
name = "CREDENTIAL_VAULT"
class_name = "CredentialVault"

[exports.SyncHub]
type = "durable-object"
storage = "sqlite"

[exports.CredentialVault]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["0 * * * *", "15,45 * * * *"]

[vars]
APP_NAME = "Inkstone"

[observability]
enabled = true
